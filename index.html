<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Breakup Recovery Guide"
      href="/rss.xml"
    />
    <!-- Per-route <title>, description, and social tags are injected by src/components/Seo.tsx -->
    <title>Breakup Recovery Guide</title>
    <script>
      // Apply the saved theme and text size before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark =
            t === "dark" ||
            ((!t || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var e = document.documentElement;
          e.classList.add(dark ? "dark" : "light");
          e.style.colorScheme = dark ? "dark" : "light";
          var fs = parseFloat(localStorage.getItem("brg:font-scale"));
          if (fs >= 0.8 && fs <= 1.5) e.style.setProperty("--article-scale", String(fs));
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
